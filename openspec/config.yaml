schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  OpenSpec 文档与资料语言规范：
  1. 创建新的 active change 时，默认使用简体中文生成`proposal.md`、
     `design.md`、`tasks.md`、delta specs 以及相关开发资料。
  2. 如果用户明确要求英文，或交付物明确面向英文读者，再改为英文；
     否则保持简体中文。
  3. 站点文档、博客和页面文案采用“中文主稿优先”流程：先维护
     `apps/lina-site/i18n/zh-Hans/`下的中文内容，确认后再同步到默认
     语言目录中的英文主内容，例如`apps/lina-site/docs/`、
     `apps/lina-site/blog/`以及其他默认语言源文件。
  4. 文档新增、重命名或删除时，中英文内容需要同步调整，保持结构、
     front matter、slug、导航与链接的一致性，避免页面静默回退。
  5. `openspec/changes/archive/`和`openspec/specs/`中的归档文档与基线
     规范默认也使用简体中文；如需英文版，应在中文定稿基础上补充
     对应英文内容。
  6. 项目开发中的资料文件、调研记录、设计说明、问题复盘等内部文档，
     默认使用简体中文。

# Per-artifact rules
rules:
  tasks:
    - |
      当任务涉及 E2E 测试用例时，TC ID 的生成需要遵循`linasite-e2e`技能约定。
