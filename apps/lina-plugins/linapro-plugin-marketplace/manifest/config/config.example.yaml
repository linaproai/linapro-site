# LinaPro Plugin Marketplace — configuration template.
# Marketplace settings are maintained by this plugin, not by the host framework
# config.yaml. Copy values into one of the plugin-owned runtime sources
# (config.example.yaml itself is never loaded automatically):
#
# 1) Development default in this plugin:
#    apps/lina-plugins/linapro-plugin-marketplace/manifest/config/config.yaml
# 2) Production file under the host config root (plugin-scoped path only):
#    <config-root>/plugins/linapro-plugin-marketplace/config.yaml
#
# These platform tokens are used only when a Git source registration does not
# supply its own accessToken. They are never returned by marketplace APIs and
# are not written into per-publisher credential rows.

# Local filesystem root for marketplace package bytes, Git documentation
# snapshots, and controlled download content. Relative paths resolve against the
# monorepo workspace root via runtimepath (make dev injects
# LINAPRO_WORKSPACE_ROOT), not the process working directory. Development
# default stays under <repo>/temp/; use an absolute path in production
# (for example /var/lib/linapro/plugin-marketplace).
storage:
  root: "temp/plugin-marketplace/artifacts"

# GitHub personal access token for public repository metadata discovery.
# Classic: public_repo. Fine-grained: Contents: Read on the target repos.
# Raises the REST primary rate limit from 60/hour (unauthenticated IP) to
# 5,000/hour (authenticated user/token).
github:
  accessToken: ""

# Optional Gitee personal access token for the same discovery path.
gitee:
  accessToken: ""
